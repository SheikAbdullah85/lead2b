<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lead2b - Offline Mode</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background: #334155;
      color: #94a3b8;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      max-width: 380px;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="badge">OFFLINE MODE</div>
  <h1>lead2b is Ready Offline</h1>
  <p>You can continue scanning badges, adding manual leads, and recording notes. Your data is saved locally on this device and will sync automatically once connected.</p>
  <a href="/app/dashboard" class="btn">Go to Mobile Dashboard</a>
</body>
</html>
